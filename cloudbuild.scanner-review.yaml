# Read existing immutable image only. No deployment, credentials or IAM mutation.
steps:
  # Official runtime installer configures the Google package repository.
  # https://github.com/GoogleCloudPlatform/cloud-sdk-docker/blob/master/docs/user_guide.md
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:ee2115362cc5e05064ace2398593dc2489444fda581db3f61410a84c318f3066
    env: ['COMPONENTS=google-cloud-cli-local-extract']
    args:
      - bash
      - -c
      - |
        set -euo pipefail
        python=$$(gcloud info --format="value(basic.python_location)")
        test -x "$$python"
        timeout 480 gcloud artifacts docker images scan "${_IMAGE}" --remote --project=enterprise-gemma2 --location=us --format=json > /workspace/review.json
        cat /workspace/review.json
        scan=$$("$$python" -c 'import json; x=json.load(open("/workspace/review.json")); assert x.get("done") and not x.get("error"), x; print(x["response"]["scan"])')
        timeout 90 gcloud artifacts docker images list-vulnerabilities "$$scan" --project=enterprise-gemma2 --format=json > /workspace/findings.json
        cat /workspace/findings.json
        "$$python" -c 'import json,collections; x=json.load(open("/workspace/findings.json")); print("SCANNER_IMAGE_REVIEW_COUNTS",dict(collections.Counter(i.get("vulnerability",{}).get("effectiveSeverity",i.get("vulnerability",{}).get("severity","UNKNOWN")) for i in x)))'
timeout: 900s
queueTtl: 600s
options:
  machineType: E2_STANDARD_2

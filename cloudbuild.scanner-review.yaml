# Read existing immutable image only. No deployment, credentials or IAM mutation.
steps:
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        timeout 60 apt-get update -qq
        timeout 120 apt-get install -y --no-install-recommends google-cloud-cli-local-extract
        timeout 480 gcloud artifacts docker images scan "${_IMAGE}" --remote --project=enterprise-gemma2 --location=us --format=json > /workspace/review.json
        cat /workspace/review.json
        scan=$$(python3 -c 'import json; x=json.load(open("/workspace/review.json")); assert x.get("done") and not x.get("error"), x; print(x["response"]["scan"])')
        timeout 90 gcloud artifacts docker images list-vulnerabilities "$$scan" --project=enterprise-gemma2 --format=json > /workspace/findings.json
        cat /workspace/findings.json
        python3 -c 'import json,collections; x=json.load(open("/workspace/findings.json")); print("SCANNER_IMAGE_REVIEW_COUNTS",dict(collections.Counter(i.get("vulnerability",{}).get("effectiveSeverity",i.get("vulnerability",{}).get("severity","UNKNOWN")) for i in x)))'
timeout: 900s
queueTtl: 600s
options:
  machineType: E2_STANDARD_2

# Small context; pinned parent retains tested code and source documents.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--platform', 'linux/amd64', '--file', 'Dockerfile.accounts-runtime-repair', '--tag', '${_IMAGE}', '.']
images: ['${_IMAGE}']
timeout: 600s
queueTtl: 600s
options:
  machineType: E2_MEDIUM
